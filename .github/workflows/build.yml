name: Build Installers

# Builds native installers for macOS (Apple Silicon + Intel) and Windows.
#
#  • Push a version tag (e.g. `v0.1.0`)  -> builds all installers and attaches
#    them to a DRAFT GitHub Release for that tag.
#  • Run manually ("Run workflow")       -> builds all installers and uploads
#    them as downloadable workflow artifacts (no release is created).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Cancel an in-progress run if a newer one starts on the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            arch: apple-silicon
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            arch: intel
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            arch: x64
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS builds need both Apple targets available; Windows needs none extra.
          targets: ${{ contains(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.platform }}-${{ matrix.arch }}

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build the app (and draft release on tags)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # When triggered by a tag push, create/append to a draft release.
          # Otherwise these are empty and tauri-action just builds.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Check Writer {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload installers as artifacts (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: warn
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*-setup.exe
